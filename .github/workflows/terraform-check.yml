name: Terraform Check

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'src/**'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'src/**'
  workflow_dispatch:

jobs:
  python-syntax-check:
    name: Check Lambda source files compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile all Lambda source files
        run: |
          echo "Checking every app.py under src/ compiles cleanly..."
          find src -name "app.py" -print0 | xargs -0 -n1 python -m py_compile
          echo "All Lambda source files compiled successfully."

  terraform-plan:
    name: Terraform validate & plan
    runs-on: ubuntu-latest
    needs: python-syntax-check
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

            - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_VIDACARE }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_VIDACARE }}
          aws-region: us-east-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -no-color